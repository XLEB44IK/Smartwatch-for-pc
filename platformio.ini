; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps = 
	olikraus/U8g2 @ ^2.32.15
	Rtc
	arduino-libraries/NTPClient@^3.0.0
	ESP8266WiFi
	ArduinoJson@^6.20.0
	AHT10
	iarduino_Pressure_BMP
	UniversalTelegramBot
	ButtonManager

monitor_speed = 9600

# Temporarily disable Library Dependency Finder scanning of local `lib/` to
# speed up builds and rely on `lib_deps`. This avoids long "Scanning dependencies..."
# delays when there are many local libraries. You can remove or comment this
# line later if you want full local-library resolution.
; lib_ldf_mode was temporarily disabled to speed up scanning; restore default to allow core libs (Wire/SPI) to be found
; lib_ldf_mode = off
